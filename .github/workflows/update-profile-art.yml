name: Update Profile Art & Heatmap

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Live GitHub Contributions
        run: |
          python scripts/fetch_contributions.py

      - name: Render Heatmap SVG
        run: |
          python scripts/render_heatmap_svg.py

      - name: Commit and Push Updated Heatmap [skip ci]
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chroma(auto): update daily contribution heatmap stats [skip ci]"
          file_pattern: 'contrib-heatmap.svg data/contributions.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
