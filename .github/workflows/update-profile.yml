name: Daily Profile Stats & Art Update

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch Live GitHub Contributions
        run: python scripts/fetch_github_contributions.py

      - name: Fetch Live Codeforces Stats
        run: python scripts/fetch_codeforces.py

      - name: Fetch Live LeetCode Stats
        run: python scripts/fetch_leetcode.py

      - name: Render Heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Render Info Card SVG
        run: python scripts/make_info_card.py

      - name: Render CP Stats SVG
        run: python scripts/render_cp_stats_svg.py

      - name: Commit and Push Updated Profile Stats [skip ci]
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chroma(auto): update daily profile & CP stats [skip ci]"
          file_pattern: 'contrib-heatmap.svg info-card.svg cp-stats.svg ascii.svg data/*.json'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
