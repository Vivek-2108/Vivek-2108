<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 457 386" width="457" height="386">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;display=swap');
    .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
    .header { fill: #161b22; rx: 10px; ry: 10px; }
    .title { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .ascii-text { font-family: 'Fira Code', monospace; font-size: 10.5px; fill: #39d353; font-weight: 600; white-space: pre; }
    .line { opacity: 0; animation: typeRow 0.15s ease-out forwards; }
    @keyframes typeRow {
      0% { opacity: 0; transform: translateX(-4px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    .l-0 { animation-delay: 0.0s; }
    .l-1 { animation-delay: 0.05s; }
    .l-2 { animation-delay: 0.1s; }
    .l-3 { animation-delay: 0.15s; }
    .l-4 { animation-delay: 0.2s; }
    .l-5 { animation-delay: 0.25s; }
    .l-6 { animation-delay: 0.3s; }
    .l-7 { animation-delay: 0.35s; }
    .l-8 { animation-delay: 0.4s; }
    .l-9 { animation-delay: 0.45s; }
    .l-10 { animation-delay: 0.5s; }
    .l-11 { animation-delay: 0.55s; }
    .l-12 { animation-delay: 0.6s; }
    .l-13 { animation-delay: 0.65s; }
    .l-14 { animation-delay: 0.7s; }
    .l-15 { animation-delay: 0.75s; }
    .l-16 { animation-delay: 0.8s; }
    .l-17 { animation-delay: 0.85s; }
    .l-18 { animation-delay: 0.9s; }
    .l-19 { animation-delay: 0.95s; }
    .l-20 { animation-delay: 1.0s; }
    .l-21 { animation-delay: 1.05s; }
    .l-22 { animation-delay: 1.1s; }
    .l-23 { animation-delay: 1.15s; }
    .l-24 { animation-delay: 1.2s; }
    .cursor { fill: #39d353; opacity: 0; animation: blinkCursor 0.8s step-end infinite; }
    .cursor-active { animation-delay: 1.4s; opacity: 1; }
    @keyframes blinkCursor { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</defs>
