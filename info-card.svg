<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 438" width="460" height="438">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;display=swap');
    .bg { fill: #0d1117; rx: 10px; ry: 10px; stroke: #30363d; stroke-width: 1px; }
    .header { fill: #161b22; rx: 10px; ry: 10px; }
    .title { font-family: 'Fira Code', monospace; font-size: 11px; fill: #8b949e; font-weight: 600; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .txt { font-family: 'Fira Code', monospace; font-size: 12px; }
    .cmd { fill: #58a6ff; font-weight: 700; }
    .sep { fill: #30363d; }
    .key { fill: #79c0ff; font-weight: 600; }
    .sub-key { fill: #d2a8ff; font-weight: 600; }
    .val { fill: #c9d1d9; }
    .section-head { fill: #ffa657; font-weight: 700; letter-spacing: 1px; }
    .line-anim { opacity: 0; animation: slideFadeIn 0.35s ease-out forwards; }
    @keyframes slideFadeIn {
      0% { opacity: 0; transform: translateY(6px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .l-0 { animation-delay: 0.0s; }
    .l-1 { animation-delay: 0.05s; }
    .l-2 { animation-delay: 0.1s; }
    .l-3 { animation-delay: 0.15s; }
    .l-4 { animation-delay: 0.2s; }
    .l-5 { animation-delay: 0.25s; }
    .l-6 { animation-delay: 0.3s; }
    .l-7 { animation-delay: 0.35s; }
    .l-8 { animation-delay: 0.4s; }
    .l-9 { animation-delay: 0.45s; }
    .l-10 { animation-delay: 0.5s; }
    .l-11 { animation-delay: 0.55s; }
    .l-12 { animation-delay: 0.6s; }
    .l-13 { animation-delay: 0.65s; }
    .l-14 { animation-delay: 0.7s; }
    .l-15 { animation-delay: 0.75s; }
    .l-16 { animation-delay: 0.8s; }
    .l-17 { animation-delay: 0.85s; }
  </style>
</defs>
